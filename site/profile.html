<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your profile</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header>
    <div class="inner">
      <a class="brand" href="home.html" aria-label="Flourishing in Diversity: home"><span class="logo" aria-hidden="true"><span>Language</span><span class="barriers">Barriers</span><span class="gateways">Gateways</span></span><span class="course">Flourishing in Diversity</span></a>
      <nav><a href="home.html">Home</a><button id="signout" class="link" type="button">Sign out</button></nav>
    </div>
  </header>

  <main>
    <h1 id="heading">Your profile</h1>
    <p class="lead" id="intro">These details help us shape the course around the languages in the room.</p>

    <form id="form" class="card" hidden>
      <p id="message" class="message" hidden></p>

      <p class="meta" id="membership"></p>

      <label for="given_name">Given name</label>
      <input id="given_name" autocomplete="given-name" required>

      <label for="family_name">Family name</label>
      <input id="family_name" autocomplete="family-name">

      <label for="mother_tongue">Mother tongue <span class="hint">(the language you first learned)</span></label>
      <input id="mother_tongue" required>

      <label for="other_languages">Other languages <span class="hint">(separate with commas)</span></label>
      <input id="other_languages" placeholder="e.g. English, French">

      <label for="email">Email</label>
      <input id="email" readonly>

      <button type="submit" id="save">Save</button>
    </form>
  </main>

  <footer><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · © Zipf (Jersey) Ltd</footer>

  <script type="module">
    import { supabase, requireSignedIn, showMessage, friendlyError, signOut, pageUrl } from './assets/app.js';

    const fields = ['given_name', 'family_name', 'mother_tongue', 'other_languages'];
    const form = document.getElementById('form');
    const message = document.getElementById('message');

    document.getElementById('signout').addEventListener('click', signOut);

    const { profile } = await requireSignedIn();
    if (profile) {
      const firstVisit = !profile.confirmed_at;
      if (firstVisit) {
        document.getElementById('heading').textContent = 'Welcome! Please check your details';
        document.getElementById('intro').textContent = 'We’ve filled in what we know from your invitation. Correct anything that’s wrong, then save to continue.';
        document.getElementById('save').textContent = 'Save and continue';
      }

      for (const f of fields) document.getElementById(f).value = profile[f] ?? '';
      document.getElementById('email').value = profile.email;

      const [{ data: church }, { data: cohort }] = await Promise.all([
        supabase.from('churches').select('name').eq('id', profile.church).single(),
        supabase.from('cohorts').select('name').eq('id', profile.cohort).single(),
      ]);
      document.getElementById('membership').textContent =
        `${church?.name ?? profile.church} · ${cohort?.name ?? profile.cohort}`;
      form.hidden = false;

      form.addEventListener('submit', async e => {
        e.preventDefault();
        e.submitter.disabled = true;
        const changes = Object.fromEntries(fields.map(f => [f, document.getElementById(f).value.trim() || null]));
        if (firstVisit) changes.confirmed_at = new Date().toISOString();
        const { error } = await supabase.from('profiles').update(changes).eq('id', profile.id);
        e.submitter.disabled = false;
        if (error) return showMessage(message, friendlyError(error));
        if (firstVisit) return location.replace(pageUrl('home.html'));
        showMessage(message, 'Saved.', 'ok');
      });
    }
  </script>
</body>
</html>
