<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flourishing in Diversity</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header id="site-header"></header>

  <main id="main" class="part-layout">
    <article>
    <p class="kicker" id="crumb"></p>
    <h1 id="title">Loading…</h1>
    <p class="lead" id="summary"></p>

    <div class="tabs ui" role="tablist" id="tabs" hidden></div>

    <section id="panel-read" class="prose" role="tabpanel" hidden>
      <div id="body"></div>
      <div id="read-end" aria-hidden="true"></div>
    </section>

    <section id="panel-watch" role="tabpanel" hidden>
      <div class="video"><div id="player"></div></div>
      <p class="meta" id="watch-note"></p>
      <p class="message ok ui" id="watch-end" hidden></p>
    </section>

    <section id="panel-slides" role="tabpanel" hidden>
      <figure class="carousel">
        <img id="slide" alt="">
        <figcaption class="ui carousel-bar">
          <button id="prev-slide" class="secondary" type="button" aria-label="Previous slide">←</button>
          <span id="slide-count" class="meta" aria-live="polite"></span>
          <button id="next-slide" class="secondary" type="button" aria-label="Next slide">→</button>
        </figcaption>
      </figure>
    </section>

    <section class="card notes ui" id="notes" hidden>
      <h2>Your notes</h2>
      <label for="note">What has struck you here?</label>
      <textarea id="note" rows="6" maxlength="20000"></textarea>
      <fieldset class="choices" id="share">
        <legend>Who can see this note?</legend>
        <label><input type="radio" name="share" value="everyone"> All participants</label>
        <label><input type="radio" name="share" value="church"> My church</label>
        <label><input type="radio" name="share" value="cohort"> My cohort</label>
        <label><input type="radio" name="share" value="me"> Only me</label>
      </fieldset>
      <p class="meta" id="share-help"></p>
      <p class="meta" id="note-status" aria-live="polite">Your note saves as you type.</p>
    </section>

    <section class="others ui" id="others" hidden>
      <h2>Notes from participants</h2>
      <fieldset class="choices compact" id="scope">
        <legend>Show notes from</legend>
        <label><input type="radio" name="scope" value="all"> All participants</label>
        <label><input type="radio" name="scope" value="church"> My church</label>
        <label><input type="radio" name="scope" value="cohort"> My cohort</label>
        <label><input type="radio" name="scope" value="mine"> Only me</label>
      </fieldset>
      <ul class="note-list" id="note-list"></ul>
    </section>

    <nav class="pager ui" id="pager" aria-label="Segments"></nav>
    </article>
    <aside class="part-nav ui" id="part-nav" aria-label="This session"></aside>
  </main>

  <footer><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · © Zipf (Jersey) Ltd</footer>

  <script type="module">
    import { marked } from 'https://cdn.jsdelivr.net/npm/marked@18.0.14/+esm';
    import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify@3.4.16/+esm';
    import { supabase, requireSignedIn, pageUrl, loadCourse, recordProgress, signedUrls,
             isComplete, formatTime, partTitle, MODES } from './assets/app.js';
    const $ = id => document.getElementById(id);
    const render = md => DOMPurify.sanitize(marked.parse(md ?? ''));

    const { profile } = await requireSignedIn();
    if (profile) {
      if (!profile.confirmed_at) location.replace(pageUrl('profile.html'));
      const id = new URLSearchParams(location.search).get('id');
      const { segments, progress } = await loadCourse();
      const index = segments.findIndex(s => s.id === id);
      if (index < 0) {
        $('title').textContent = 'Not found';
        $('summary').innerHTML = 'This part of the course isn’t available. <a href="home.html">Back to the course</a>.';
      } else {
        await show(segments, index, progress, profile);
      }
    }

    async function show(segments, index, progress, profile) {
      const seg = segments[index];
      const session = seg.session;
      document.title = `${seg.part} ${seg.title} · Flourishing in Diversity`;
      $('crumb').textContent = `Session ${session.number}: ${session.title}`
        + (session.published_at ? '' : ' · Draft (only admins can see this)');
      $('title').innerHTML = partTitle(seg, DOMPurify.sanitize);
      $('summary').textContent = seg.summary ?? '';

      const [{ data: full }, { data: contributions }, urls] = await Promise.all([
        supabase.from('segments').select('body').eq('id', seg.id).single(),
        supabase.from('contributions').select('kind, title, body, position').eq('segment', seg.id).order('kind').order('position'),
        signedUrls(seg.slides),
      ]);

      // Which ways of taking in this segment are available.
      const available = ['read'];
      if (session.youtube_id && seg.youtube_start != null) available.push('watch');
      if (seg.slides.length) available.push('slides');

      const mine = progress[seg.id] ?? {};
      const tabs = $('tabs');
      tabs.hidden = available.length < 2;
      for (const mode of available) {
        const b = document.createElement('button');
        b.role = 'tab';
        b.id = `tab-${mode}`;
        b.setAttribute('aria-controls', `panel-${mode}`);
        b.textContent = MODES[mode] + (mine[mode]?.completed_at ? ' ✓' : '');
        b.addEventListener('click', () => select(mode));
        tabs.append(b);
      }

      const started = new Set();
      const completed = new Set(Object.keys(mine).filter(m => mine[m].completed_at));
      async function complete(mode) {
        if (completed.has(mode)) return;
        completed.add(mode);
        // Tick the tab only once the database has it, so the home page agrees.
        if (await recordProgress(seg.id, mode, true)) { $(`tab-${mode}`).textContent = `${MODES[mode]} ✓`; drawNav(); }
        else completed.delete(mode);
      }

      const setup = { read: setupRead, watch: setupWatch, slides: setupSlides };
      function select(mode) {
        for (const m of available) {
          $(`panel-${m}`).hidden = m !== mode;
          $(`tab-${m}`).setAttribute('aria-selected', String(m === mode));
        }
        history.replaceState(null, '', `#${mode}`);
        if (!started.has(mode)) {
          started.add(mode);
          if (!completed.has(mode)) recordProgress(seg.id, mode);
          setup[mode]();
        }
      }

      function setupRead() {
        const body = (full?.body ?? '').replace(/\]\(slide:(\d+)\)/g, (m, n) => `](${urls[seg.slides[n - 1]] ?? ''})`);
        // Table write-ups and prayers go where the body marks <!-- contributions -->, or at the end.
        const [before, after = ''] = body.split('<!-- contributions -->');
        const group = (kind, heading) => {
          const items = (contributions ?? []).filter(c => c.kind === kind);
          return items.length
            ? `<h2>${heading}</h2>` + items.map(c => `<h3>${DOMPurify.sanitize(c.title)}</h3>${render(c.body)}`).join('')
            : '';
        };
        $('body').innerHTML = render(before) + group('table', 'At the tables') + group('prayers', 'Prayers from the tables') + render(after);
        // Reaching the end of the write-up counts as having read it.
        new IntersectionObserver((entries, obs) => {
          if (entries.some(e => e.isIntersecting)) { complete('read'); obs.disconnect(); }
        }).observe($('read-end'));
      }

      function setupWatch() {
        $('watch-note').textContent = `This part runs from ${formatTime(seg.youtube_start)}`
          + (seg.youtube_end ? ` to ${formatTime(seg.youtube_end)}` : '') + ' of the session video.';
        // YouTube's own start/end only hold for the first play, so keep playback inside this part
        // ourselves: pause at the end, and jump back in if someone seeks outside the part.
        const start = seg.youtube_start, end = seg.youtube_end;
        let player, timer;
        const finished = () => {
          const next = segments[index + 1];
          $('watch-end').innerHTML = 'That’s the end of this part.'
            + (next ? ` <a href="segment.html?id=${next.id}#watch">Watch ${partTitle(next, DOMPurify.sanitize)} →</a>` : '');
          $('watch-end').hidden = false;
          complete('watch');
        };
        const keepInside = () => {
          const t = player.getCurrentTime();
          if (t < start - 1) player.seekTo(start, true);
          else if (end && t >= end) { player.pauseVideo(); player.seekTo(end, true); finished(); }
        };
        const create = () => { player = new YT.Player('player', {
          host: 'https://www.youtube-nocookie.com',
          videoId: session.youtube_id,
          playerVars: { start, ...(end ? { end } : {}), rel: 0, playsinline: 1 },
          events: { onStateChange: e => {
            clearInterval(timer);
            if (e.data === YT.PlayerState.PLAYING) {
              // Pressing play at the end of the part starts it again from the beginning.
              if (end && player.getCurrentTime() >= end - 1) player.seekTo(start, true);
              $('watch-end').hidden = true;
              timer = setInterval(keepInside, 250);
            }
            if (e.data === YT.PlayerState.ENDED) finished();
          } },
        }); };
        if (window.YT?.Player) return create();
        window.onYouTubeIframeAPIReady = create;
        const s = document.createElement('script');
        s.src = 'https://www.youtube.com/iframe_api';
        document.head.append(s);
      }

      function setupSlides() {
        let i = 0;
        const n = seg.slides.length;
        const go = to => {
          i = Math.max(0, Math.min(n - 1, to));
          $('slide').src = urls[seg.slides[i]] ?? '';
          $('slide').alt = `Slide ${i + 1} of ${n}`;
          $('slide-count').textContent = `${i + 1} / ${n}`;
          $('prev-slide').disabled = i === 0;
          $('next-slide').disabled = i === n - 1;
          if (i === n - 1) complete('slides');
        };
        $('prev-slide').addEventListener('click', () => go(i - 1));
        $('next-slide').addEventListener('click', () => go(i + 1));
        document.addEventListener('keydown', e => {
          if ($('panel-slides').hidden || e.target.closest('input, textarea')) return;
          if (e.key === 'ArrowLeft') go(i - 1);
          if (e.key === 'ArrowRight') go(i + 1);
        });
        let touchX = null;
        $('slide').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
        $('slide').addEventListener('touchend', e => {
          const dx = e.changedTouches[0].clientX - touchX;
          if (Math.abs(dx) > 40) go(dx < 0 ? i + 1 : i - 1);
        });
        go(0);
      }

      // My note: one per part, saved as you type, shared as I choose (all participants by default).
      // Shared notes are shown without names; notes for all participants reach other churches once approved.
      const note = $('note'), status = $('note-status');
      const SHARE_HELP = {
        everyone: 'Everyone on the course can read this, without your name. Other churches see it once an admin has approved it.',
        church: 'People from your church can read this, without your name.',
        cohort: 'People in your cohort can read this, without your name.',
        me: 'Only you can see this note.',
      };
      const shareInputs = [...document.querySelectorAll('input[name="share"]')];
      const sharing = () => shareInputs.find(i => i.checked)?.value ?? 'everyone';
      const { data: saved } = await supabase.from('notes').select('body, visibility').eq('segment', seg.id).maybeSingle();
      note.value = saved?.body ?? '';
      const showShare = v => { shareInputs.forEach(i => { i.checked = i.value === v; }); $('share-help').textContent = SHARE_HELP[v]; };
      showShare(saved?.visibility ?? 'everyone');
      $('notes').hidden = false;

      let saveTimer = null, lastSaved = `${note.value}\u0000${sharing()}`;
      const saveNote = async () => {
        clearTimeout(saveTimer); saveTimer = null;
        const body = note.value, visibility = sharing(), key = `${body}\u0000${visibility}`;
        if (key === lastSaved || (!saved && !body)) return;
        status.textContent = 'Saving…';
        const { error } = await supabase.rpc('save_note', { p_segment: seg.id, p_body: body, p_visibility: visibility });
        if (error) { status.textContent = 'Couldn’t save just now. Check your connection; your text is still here.'; console.error(error); return; }
        lastSaved = key;
        if (`${note.value}\u0000${sharing()}` === key) status.textContent = 'Saved.';
        loadOthers();
      };
      note.addEventListener('input', () => { status.textContent = 'Editing…'; clearTimeout(saveTimer); saveTimer = setTimeout(saveNote, 800); });
      note.addEventListener('blur', saveNote);
      shareInputs.forEach(i => i.addEventListener('change', () => { showShare(i.value); saveNote(); }));
      document.addEventListener('visibilitychange', () => { if (document.hidden) saveNote(); });
      window.addEventListener('pagehide', saveNote);

      // Notes from participants, filtered by scope (all participants by default; remembered on this device).
      const scopeInputs = [...document.querySelectorAll('input[name="scope"]')];
      let scope = 'all';
      try { scope = localStorage.getItem('fid-note-scope') || 'all'; } catch {}
      scopeInputs.forEach(i => { i.checked = i.value === scope; });
      const when = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      async function loadOthers() {
        const { data, error } = await supabase.rpc('notes_for_segment', { p_segment: seg.id, p_scope: scope });
        if (error) { console.error(error); return; }
        $('note-list').innerHTML = data.length
          ? data.map(n => `<li class="${n.mine ? 'mine' : ''}"><p>${DOMPurify.sanitize(n.body, { ALLOWED_TAGS: [] }).replace(/\n/g, '<br>')}</p>
              <span class="meta">${n.mine ? 'Your note · ' : ''}${when(n.updated_at)}</span></li>`).join('')
          : `<li class="empty meta">${scope === 'mine' ? 'You haven’t written a note on this part yet.' : 'No notes here yet. Yours could be the first.'}</li>`;
        $('others').hidden = false;
      }
      scopeInputs.forEach(i => i.addEventListener('change', () => {
        scope = i.value;
        try { localStorage.setItem('fid-note-scope', scope); } catch {}
        loadOthers();
      }));
      loadOthers();

      // Sidebar on wide screens: every part of this session, with ticks.
      const navItem = s => {
        const done = s.id === seg.id ? completed.size > 0 : isComplete(progress[s.id]);
        return `<li class="${done ? 'done' : ''}${s.id === seg.id ? ' current' : ''}" data-seg="${s.id}">
          <span class="tick">${done ? '✓' : ''}</span>
          <a href="segment.html?id=${s.id}"${s.id === seg.id ? ' aria-current="page"' : ''}>${partTitle(s, DOMPurify.sanitize)}</a></li>`;
      };
      const drawNav = () => {
        $('part-nav').innerHTML = `<p class="kicker">Session ${session.number}</p><ol class="segments">${session.segments.map(navItem).join('')}</ol>`;
      };
      drawNav();

      // Previous / next segment across the whole course.
      const prev = segments[index - 1], next = segments[index + 1];
      $('pager').innerHTML =
        (prev ? `<a class="prev" href="segment.html?id=${prev.id}">← ${partTitle(prev, DOMPurify.sanitize)}</a>` : '<span></span>') +
        (next ? `<a class="next" href="segment.html?id=${next.id}">${partTitle(next, DOMPurify.sanitize)} →</a>` : '<a class="next" href="home.html">Back to the course</a>');

      const wanted = location.hash.slice(1);
      select(available.includes(wanted) ? wanted : 'read');
    }
  </script>
  <script type="module" src="assets/header.js"></script>
</body>
</html>
