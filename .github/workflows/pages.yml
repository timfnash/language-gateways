# Publishes the site/ folder to GitHub Pages on every push to main.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Upload and deploy are separate jobs (as in GitHub's starter workflow): when deploy-pages runs straight after the
# upload in the same job, GitHub's artifact listing can lag and it fails with "No artifacts named github-pages"
# (https://github.com/actions/deploy-pages/issues/451).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Tag the shared CSS and JS with this commit, so browsers fetch fresh copies after each deploy
      # instead of mixing a new page with a cached old stylesheet or script.
      - name: Version asset links
        run: |
          v=${GITHUB_SHA::7}
          sed -i -E "s#(assets/(app\.css|app\.js|header\.js))([\"'])#\1?v=$v\3#g" site/*.html
          sed -i -E "s#'\./app\.js'#'./app.js?v=$v'#g" site/assets/*.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
